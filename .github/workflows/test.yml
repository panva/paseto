name: Test

permissions:
  contents: read

on:
  push:
    branches: [main, trigger-ci]
  pull_request:
    branches: [main]
  schedule:
    - cron: '53 11 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-versions:
    uses: panva/.github/.github/workflows/node-versions.yml@3faba8af3880247be43547787aedd52780c9f946
    with:
      min: 22

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'
          check-latest: true
      - run: npm clean-install
      - run: node --run build
      - run: node --run build:other
      - name: Type-level regression tests
        run: node --run typecheck:types
      - name: Packaging metadata and type resolution
        run: node --run check:packaging
      - name: Flat module and tree-shaking contract
        run: node --run check:treeshaking
      - name: Packed artifact contents and runtime
        run: node --run test:dist
      - run: node --run format -- --write false --check --log-level warn
      - run: git diff --exit-code

  docs:
    name: docs
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'
          check-latest: true
      - run: npm clean-install
      - run: git diff --exit-code
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          pandoc-version: latest
      - run: node --run test:docs

  node:
    name: node (${{ matrix.node-version }})
    needs:
      - node-versions
      - build
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.node-versions.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          check-latest: true
      - run: npm clean-install
      - run: node --run test

  deno:
    name: deno
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: latest
      - run: npm clean-install
      - run: deno run test:deno

  bun:
    name: bun
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: npm clean-install
      - run: bun run test:bun

  workerd:
    name: workerd
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'
          check-latest: true
          cache-dependency-path: |
            package-lock.json
            test/workerd/package-lock.json
      - run: npm clean-install
      - run: npm clean-install --prefix test/workerd
      - run: node --run test:workerd
        env:
          WORKERD_BIN: ${{ github.workspace }}/test/workerd/node_modules/.bin/workerd
          WORKERD_MODULE: ${{ github.workspace }}/test/workerd/node_modules/workerd

  browsers:
    name: browsers (${{ matrix.browser }})
    needs: build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, safari]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'
          check-latest: true
      - run: npm clean-install
      - name: get playwright version
        id: playwright-version
        run:
          echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >>
          "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: ./node_modules/.bin/playwright install --only-shell chromium firefox webkit
      - run: node --run test:browsers
        env:
          BROWSER: ${{ matrix.browser }}
