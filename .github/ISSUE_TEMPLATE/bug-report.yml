name: 🐞Bug report
description: There's a bug I want to report
labels:
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Do not use this form to ask questions or make suggestions; use the [appropriate](https://github.com/panva/paseto/issues/new/choose) Discussions topic for those.
  - type: textarea
    attributes:
      label: What happened?
      description:
        A clear and concise description of what the bug is and what you expected to happen instead.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: What exact version of the library do you use?
      placeholder: e.g. v4.0.0
    validations:
      required: true
  - type: input
    attributes:
      label: Node.js version and operating system
      description: Include the exact Node.js and operating-system versions.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Code to reproduce
      description: Please copy and paste a minimal reproduction.
      render: ts
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Required
      options:
        - label:
            I have searched the issue tracker and discussions for similar topics and could not find
            anything related.
          required: true
        - label:
            I agree to follow this project's [Code of
            Conduct](https://github.com/panva/paseto/blob/main/CODE_OF_CONDUCT.md)
          required: true
